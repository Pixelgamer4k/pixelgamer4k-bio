<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pixel Gamer 4k</title>
  <link rel="icon" href="assets/logo.jpg" />
  <style>
    :root {
      --field: #FEDD04;
      --ink: #202022;
      --ink-soft: rgba(32, 32, 34, 0.58);
      --line: rgba(32, 32, 34, 0.16);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--field);
      color: var(--ink);
      font-family: "SF Pro Display", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    body { min-height: 100dvh; }

    .cinema {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: #000;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: opacity 0.75s var(--ease), visibility 0.75s;
    }
    .cinema.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #openVid {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: var(--field);
      opacity: 0;
      transition: opacity 0.45s var(--ease);
    }
    .cinema.playing #openVid { opacity: 1; }

    .cinema-skip {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      z-index: 5;
      border: 0;
      background: rgba(254, 221, 4, 0.85);
      color: var(--ink);
      font: inherit;
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      padding: 8px 12px;
      border-radius: 999px;
      transition: opacity 0.4s;
    }
    .cinema.playing .cinema-skip {
      opacity: 1;
      pointer-events: auto;
    }

    .cinema-prompt {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 24px;
      color: var(--field);
      transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
    }
    .cinema:not(.playing) {
      background: var(--field);
    }
    .cinema:not(.playing) .cinema-prompt { color: var(--ink); }
    .cinema.playing .cinema-prompt {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
    }
    .pulse-ring {
      width: 88px;
      height: 88px;
      margin: 0 auto 22px;
      border-radius: 50%;
      border: 2px solid currentColor;
      display: grid;
      place-items: center;
      position: relative;
    }
    .pulse-ring::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1.5px solid currentColor;
      opacity: 0.3;
      animation: pulse 2.2s var(--ease) infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.92); opacity: 0.5; }
      70% { transform: scale(1.18); opacity: 0; }
      100% { opacity: 0; }
    }
    .pulse-ring svg { width: 26px; height: 26px; margin-left: 3px; }
    .cinema-prompt h1 {
      font-size: clamp(1.15rem, 3.5vw, 1.45rem);
      font-weight: 650;
      letter-spacing: 0.02em;
    }
    .cinema-prompt p {
      margin-top: 8px;
      opacity: 0.65;
      font-size: 0.9rem;
    }

    .progress {
      position: absolute;
      left: 50%;
      bottom: max(28px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(180px, 40vw);
      height: 2px;
      background: rgba(254, 221, 4, 0.25);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      z-index: 4;
    }
    .cinema.playing .progress { opacity: 1; }
    .progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--field);
    }

    .bio {
      width: min(400px, 100%);
      margin: 0 auto;
      padding: max(32px, env(safe-area-inset-top)) 22px max(40px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(22px);
      pointer-events: none;
      transition: opacity 0.75s var(--ease) 0.15s, transform 0.75s var(--ease) 0.15s;
    }
    .bio.live {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }
    .logo {
      width: min(160px, 46vw);
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 0 rgba(32, 32, 34, 0.08));
    }
    .tag {
      margin-top: 14px;
      font-size: 0.9rem;
      letter-spacing: 0.01em;
      color: var(--ink-soft);
      text-align: center;
      max-width: 28ch;
      line-height: 1.45;
    }
    .socials {
      margin-top: 38px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .social {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      border: 1.5px solid var(--ink);
      background: transparent;
      color: var(--ink);
      display: grid;
      place-items: center;
      text-decoration: none;
      transition: background 0.18s var(--ease), transform 0.18s var(--ease);
    }
    .social:hover { background: rgba(32, 32, 34, 0.06); transform: translateY(-2px); }
    .social:active { transform: scale(0.96); }
    .social svg { width: 22px; height: 22px; fill: currentColor; }
    .social[aria-label="Email"] svg { width: 20px; height: 20px; }
    .support-wrap { margin-top: 28px; width: 100%; }
    .support-btn {
      width: 100%;
      text-decoration: none;
      min-height: 54px;
      border-radius: 999px;
      border: 1.5px solid var(--ink);
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-weight: 650;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.18s var(--ease), transform 0.18s var(--ease);
    }
    .support-btn:hover { background: rgba(32, 32, 34, 0.05); }
    .support-btn:active { transform: scale(0.985); }
    .support-btn svg { width: 18px; height: 18px; }
    .mute {
      margin-top: 20px;
      border: 0;
      background: none;
      color: var(--ink-soft);
      font: inherit;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }


  </style>
</head>
<body>
  <div class="cinema" id="cinema" role="button" tabindex="0" aria-label="Tap to start">
    <video id="openVid" src="assets/opening.mp4" playsinline preload="auto" muted></video>
    <button class="cinema-skip" type="button" id="skipBtn">Skip</button>
    <div class="cinema-prompt">
      <div class="pulse-ring" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.14v13.72L19 12 8 5.14z"/></svg>
      </div>
      <h1>Pixel Gamer 4k</h1>
      <p>Tap to start</p>
    </div>
    <div class="progress" aria-hidden="true"><i id="progBar"></i></div>
  </div>

  <main class="bio" id="bio" aria-hidden="true">
    <img class="logo" src="assets/logo.jpg" alt="Pixel Gamer 4k logo" />
    <p class="tag">Make Mobile Gaming Great Again.</p>
    <nav class="socials" aria-label="Social links">
      <a class="social" href="https://github.com/Pixelgamer4k" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.477 2 2 6.586 2 12.253c0 4.537 2.865 8.382 6.839 9.74.5.094.682-.222.682-.493 0-.243-.009-.888-.014-1.743-2.782.618-3.369-1.38-3.369-1.38-.455-1.183-1.11-1.498-1.11-1.498-.908-.637.069-.624.069-.624 1.004.072 1.532 1.057 1.532 1.057.892 1.568 2.341 1.115 2.91.853.091-.664.35-1.115.636-1.371-2.22-.259-4.555-1.14-4.555-5.073 0-1.12.39-2.037 1.029-2.754-.103-.26-.446-1.302.098-2.714 0 0 .84-.276 2.75 1.052A9.34 9.34 0 0 1 12 6.844c.85.004 1.705.117 2.504.344 1.909-1.328 2.747-1.052 2.747-1.052.546 1.412.202 2.454.1 2.714.64.717 1.028 1.633 1.028 2.754 0 3.943-2.339 4.811-4.566 5.065.359.317.679.943.679 1.902 0 1.371-.013 2.477-.013 2.814 0 .274.18.592.688.492C19.138 20.63 22 16.787 22 12.253 22 6.586 17.523 2 12 2z"/></svg>
      </a>
      <a class="social" href="https://x.com/4k_isn" target="_blank" rel="noopener noreferrer" aria-label="X Main" title="X · Main">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2H21.5l-7.5 8.57L22.5 22h-6.56l-5.14-6.71L5.2 22H1.94l8.03-9.17L1.5 2h6.72l4.65 6.16L18.244 2zm-1.15 18.09h1.82L7.01 3.81H5.06l12.034 16.28z"/></svg>
      </a>
      <a class="social" href="https://x.com/isn_8k" target="_blank" rel="noopener noreferrer" aria-label="X Alt" title="X · Alt">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2H21.5l-7.5 8.57L22.5 22h-6.56l-5.14-6.71L5.2 22H1.94l8.03-9.17L1.5 2h6.72l4.65 6.16L18.244 2zm-1.15 18.09h1.82L7.01 3.81H5.06l12.034 16.28z"/></svg>
      </a>
      <a class="social" href="mailto:pixelgamer4kris@gmail.com" aria-label="Email" title="Business email">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5L4 8V6l8 5 8-5v2z"/></svg>
      </a>
    </nav>
    <div class="support-wrap">
      <a class="support-btn" href="https://buymeacoffee.com/pixelgamer4k" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 8h1a4 4 0 0 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8zM6 2v3M10 2v3M14 2v3"/></svg>
        Buy Me a Coffee
      </a>
    </div>
    <button class="mute" type="button" id="muteBtn" aria-pressed="false">Sound on</button>
  </main>


  <script>
    const cinema = document.getElementById("cinema");
    const bio = document.getElementById("bio");
    const vid = document.getElementById("openVid");
    const progBar = document.getElementById("progBar");
    const bed = new Audio("assets/bed.mp3");
    bed.loop = true;
    bed.preload = "auto";
    window.__pg4kBed = bed;

    let started = false;
    let finished = false;

    function rampVolume(to, ms = 500) {
      const from = bed.volume;
      const t0 = performance.now();
      (function tick(now) {
        const p = Math.min(1, (now - t0) / ms);
        const e = p * p * (3 - 2 * p);
        bed.volume = from + (to - from) * e;
        if (p < 1) requestAnimationFrame(tick);
      })(t0);
    }
    window.__pg4kSetBedVolume = rampVolume;

    function finishOpening() {
      if (finished) return;
      finished = true;
      try { vid.pause(); } catch (_) {}
      cinema.classList.add("done");
      bio.setAttribute("aria-hidden", "false");
      bio.classList.add("live");
    }

    function onTime() {
      if (!vid.duration) return;
      progBar.style.width = ((vid.currentTime / vid.duration) * 100).toFixed(2) + "%";
    }

    async function startCinema() {
      if (started) return;
      started = true;
      cinema.classList.add("playing");
      vid.muted = true; // bed track is the brand music
      try {
        bed.currentTime = 0;
        bed.volume = 0;
        await bed.play();
        rampVolume(1, 700);
      } catch (_) {}
      try {
        vid.currentTime = 0;
        await vid.play();
      } catch (_) {
        finishOpening();
        return;
      }
      vid.addEventListener("timeupdate", onTime);
      vid.addEventListener("ended", finishOpening, { once: true });
    }

    function skipCinema(e) {
      e.stopPropagation();
      if (!started) return;
      finishOpening();
    }

    cinema.addEventListener("click", (e) => {
      if (e.target.id === "skipBtn") return;
      startCinema();
    });
    cinema.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") startCinema();
    });
    document.getElementById("skipBtn").addEventListener("click", skipCinema);



    const muteBtn = document.getElementById("muteBtn");
    let muted = false;
    muteBtn.addEventListener("click", () => {
      muted = !muted;
      bed.muted = muted;
      muteBtn.textContent = muted ? "Sound off" : "Sound on";
      muteBtn.setAttribute("aria-pressed", muted ? "true" : "false");
    });
  </script>
</body>
</html>
